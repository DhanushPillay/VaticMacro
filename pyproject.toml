[project]
name = "vaticmacro"
version = "0.2.0"
description = "Indian CPI YoY inflation forecasting — monthly 317-row Ridge ensemble"
readme = "README.MD"
requires-python = ">=3.12,<3.15"
dependencies = [
  "flask>=3.1",
  "gunicorn>=22",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "pydantic>=2.8",
  "pandera>=0.20",
  "joblib>=1.4",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-benchmark>=4",
  "ruff>=0.8",
  "mypy>=1.11",
  "mlflow>=2.14",
  "playwright>=1.45",
  "types-requests",
  "types-beautifulsoup4",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "notebooks/",
    ".venv/",
    "paper/",
    "app.py",
    "merge_data.py",
    "main.py",
    "run_train.py",
    ".opencode/",
    "docs/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/train_model.py" = ["E402", "F401"]
"src/data_refresh.py" = ["E402"]
"src/scheduler.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = false
exclude = ["notebooks", "paper", "tests/e2e"]
[[tool.mypy.overrides]]
module = ["lightgbm.*", "xgboost.*", "matplotlib.*", "seaborn.*", "mlflow.*", "pandera.*", "playwright.*", "sklearn.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=app --cov-fail-under=80 -q"
pythonpath = ["."]

[tool.coverage.run]
source = ["src", "app"]
omit = ["tests/*", "paper/*", "notebooks/*"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
