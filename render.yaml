services:
  - type: web
    name: vaticmacro
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRED_API_KEY
        sync: false
      - key: REFRESH_TOKEN
        sync: false
        # set in Render dashboard — protects POST /api/refresh

crons:
  - name: daily-fx-brent-refresh
    schedule: "0 6 * * *"
    command: "python src/scheduler.py daily"
  - name: monthly-cpi-wpi-rate-refresh
    schedule: "0 6 5 * *"
    command: "python src/scheduler.py monthly"
